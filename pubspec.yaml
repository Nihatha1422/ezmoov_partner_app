name: ezmoov_partner_app
description: "EZMoov Partner Application for Drivers"
publish_to: 'none'
version: 1.0.7+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  go_router: ^14.8.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  pinput: ^5.0.0
  google_fonts: ^6.2.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.5
  audioplayers: ^6.1.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.3
  flutter_overlay_window: ^0.4.5
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  razorpay_flutter: ^1.4.5
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.1
  video_player: ^2.14.0
  scaled_app: ^2.3.2
  http: ^1.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_green.png"
  adaptive_icon_background: "#09A234"
  adaptive_icon_foreground: "assets/icon/app_icon_transparent.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/videos/

